name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # real PROS / LemLib / EZ-Template / JAR-Template headers, so generated code is compile-checked
      - run: npm run fetch-refs
      - run: npm run check
